[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "piston-native"
version = "0.1.0"
description = "Bounded native instruction fixtures for PistonDecompiler"
requires-python = ">=3.11"
dependencies = ["unicorn>=2.1,<3", "capstone>=5,<6"]
license = "AGPL-3.0-only"

[project.scripts]
piston-native = "piston_native.__main__:main"
