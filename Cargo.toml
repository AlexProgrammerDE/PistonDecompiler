[package]
name = "piston-decompiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Persistent binary analysis with Ghidra and AI"
license = "AGPL-3.0-only"
repository = "https://github.com/AlexProgrammerDE/PistonDecompiler"
homepage = "https://decompiler.pistonmaster.net"

[[bin]]
name = "pistondecompiler"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
fs2 = "0.4"
hex = "0.4"
object = "0.38"
petgraph = "0.8"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tonic = "0.14"
tonic-prost = "0.14"
tonic-web = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
schemars = { version = "1.2.2", features = ["derive"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
