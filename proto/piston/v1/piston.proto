syntax = "proto3";
package piston.v1;

service PistonService {
  rpc ListBinaries(Empty) returns (BinaryList);
  rpc ImportBinary(ImportRequest) returns (Binary);
  rpc GetOverview(BinaryRequest) returns (Overview);
  rpc ListFunctions(FunctionQuery) returns (FunctionList);
  rpc GetFunction(FunctionRequest) returns (FunctionDetail);
  rpc ListJobs(BinaryRequest) returns (JobList);
  rpc ListEvents(BinaryRequest) returns (EventList);
  rpc ControlPipeline(ControlRequest) returns (Empty);
  rpc ReviewProposal(ReviewRequest) returns (Empty);
  rpc GetSettings(Empty) returns (Settings);
}
message Empty {}
message BinaryRequest { string binary_id = 1; }
message Binary {
  string id = 1; string name = 2; string sha256 = 3; uint64 size = 4;
  string architecture = 5; string format = 6; string status = 7;
  int64 created_at = 8; string error = 9;
}
message BinaryList { repeated Binary binaries = 1; }
message ImportRequest { string path = 1; string name = 2; bytes content = 3; }
message Overview {
  Binary binary = 1; uint32 functions = 2; uint32 eligible = 3; uint32 analyzed = 4;
  uint32 queued = 5; uint32 running = 6; uint32 failed = 7; uint32 proposals = 8;
  uint64 input_tokens = 9; uint64 output_tokens = 10; double cost_usd = 11;
  double reserved_usd = 12; double budget_usd = 13; uint32 edges = 14; uint32 modules = 15;
  repeated UsagePoint usage = 16; repeated Stage stages = 17; bool paused = 18;
  repeated ProviderBreakdown provider_breakdowns = 19;
}
message UsagePoint { string bucket = 1; uint64 input_tokens = 2; uint64 output_tokens = 3; double cost_usd = 4; uint32 requests = 5; }
message Stage { string name = 1; uint32 queued = 2; uint32 completed = 3; uint32 failed = 4; uint32 running = 5; }
message ProviderBreakdown {
  string model = 1; string stage = 2; uint32 requests = 3;
  uint64 input_tokens = 4; uint64 output_tokens = 5; double cost_usd = 6;
  double average_latency_ms = 7;
}
message FunctionQuery { string binary_id = 1; string search = 2; uint32 offset = 3; uint32 limit = 4; string filter = 5; }
message Function {
  string id = 1; string address = 2; string name = 3; uint64 size = 4;
  uint32 callers = 5; uint32 callees = 6; string skip_reason = 7;
  string summary = 8; string proposed_name = 9; double confidence = 10;
  string module = 11; string review = 12; string status = 13;
}
message FunctionList { repeated Function functions = 1; uint32 total = 2; }
message FunctionRequest { string id = 1; }
message FunctionDetail {
  Function function = 1; string pseudocode = 2; repeated string strings = 3;
  repeated string imports = 4; repeated Function callers = 5; repeated Function callees = 6;
  string analysis_json = 7; string model = 8; string prompt_hash = 9;
  string disassembly = 10; string pcode = 11;
}
message Job { string id = 1; string function_id = 2; string name = 3; string stage = 4; string status = 5; uint32 attempts = 6; string error = 7; int64 updated_at = 8; double reserved_usd = 9; }
message JobList { repeated Job jobs = 1; }
message Event { int64 id = 1; int64 created_at = 2; string level = 3; string message = 4; }
message EventList { repeated Event events = 1; }
message ControlRequest { string binary_id = 1; string action = 2; }
message ReviewRequest { string function_id = 1; bool accept = 2; }
message Settings {
  bool ai_configured = 1; bool ghidra_configured = 2; string model = 3;
  string escalation_model = 4; uint32 concurrency = 5; double budget_usd = 6;
  uint32 max_input_bytes = 7; string provider_url = 8; bool batch_enabled = 9;
}
