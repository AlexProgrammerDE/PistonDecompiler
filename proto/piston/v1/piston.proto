syntax = "proto3";
package piston.v1;

service PistonService {
  rpc ListBinaries(Empty) returns (BinaryList);
  rpc ImportBinary(ImportRequest) returns (Binary);
  rpc GetOverview(BinaryRequest) returns (Overview);
  rpc ListFunctions(FunctionQuery) returns (FunctionList);
  rpc GetFunction(FunctionRequest) returns (FunctionDetail);
  rpc ListJobs(BinaryRequest) returns (JobList);
  rpc ListEvents(BinaryRequest) returns (EventList);
  rpc ControlPipeline(ControlRequest) returns (Empty);
  rpc ReviewProposal(ReviewRequest) returns (Empty);
  rpc GetGraph(BinaryRequest) returns (Graph);
  rpc GetResult(ArtifactRequest) returns (AnalysisResult);
  rpc ListResults(FunctionRequest) returns (ResultList);
  rpc GetArtifact(ArtifactRequest) returns (Artifact);
  rpc CorrectResult(CorrectionRequest) returns (AnalysisResult);
  rpc Reanalyze(ReanalysisRequest) returns (RunResponse);
  rpc ListInvestigations(BinaryRequest) returns (InvestigationList);
  rpc SaveInvestigation(Investigation) returns (Investigation);
  rpc PreviewApply(BinaryRequest) returns (ApplyOperation);
  rpc ListApplyOperations(BinaryRequest) returns (ApplyOperationList);
  rpc ExecuteApply(ApplyRequest) returns (ApplyOperation);
  rpc StartRecording(StartRecordingRequest) returns (Recording);
  rpc ListRecordings(BinaryRequest) returns (RecordingList);
  rpc ControlRecording(RecordingControl) returns (Recording);
  rpc GetSettings(Empty) returns (Settings);
}
message Empty {}
message BinaryRequest { string binary_id = 1; }
message Binary {
  string id = 1; string name = 2; string sha256 = 3; uint64 size = 4;
  string architecture = 5; string format = 6; string status = 7;
  int64 created_at = 8; string error = 9;
}
message BinaryList { repeated Binary binaries = 1; }
message ImportRequest { string path = 1; string name = 2; bytes content = 3; }
message Overview {
  Binary binary = 1; uint32 functions = 2; uint32 eligible = 3; uint32 analyzed = 4;
  uint32 queued = 5; uint32 running = 6; uint32 failed = 7; uint32 proposals = 8;
  uint64 input_tokens = 9; uint64 output_tokens = 10; optional double cost_usd = 11;
  reserved 12, 13; uint32 edges = 14; uint32 modules = 15;
  repeated UsagePoint usage = 16; repeated Stage stages = 17; bool paused = 18;
  repeated ProviderBreakdown provider_breakdowns = 19; string active_run_id = 20; repeated ProgressReport progress = 21; string ghidra_desktop = 22; uint32 unreported_cost_requests = 23;
}
message UsagePoint { string bucket = 1; uint64 input_tokens = 2; uint64 output_tokens = 3; optional double cost_usd = 4; uint32 requests = 5; uint32 unreported_cost_requests = 6; }
message Stage { string name = 1; uint32 queued = 2; uint32 completed = 3; uint32 failed = 4; uint32 running = 5; }
message ProviderBreakdown {
  string model = 1; string stage = 2; uint32 requests = 3;
  uint64 input_tokens = 4; uint64 output_tokens = 5; optional double cost_usd = 6;
  optional double average_latency_ms = 7; uint32 unreported_cost_requests = 8;
}
message FunctionQuery { string binary_id = 1; string search = 2; uint32 offset = 3; uint32 limit = 4; string filter = 5; }
message Function {
  string id = 1; string address = 2; string name = 3; uint64 size = 4;
  uint32 callers = 5; uint32 callees = 6; string skip_reason = 7;
  string summary = 8; string proposed_name = 9; double confidence = 10;
  string module = 11; string review = 12; string status = 13; string result_id = 14; bool stale = 15;
}
message FunctionList { repeated Function functions = 1; uint32 total = 2; }
message FunctionRequest { string id = 1; }
message FunctionDetail {
  Function function = 1; string pseudocode = 2; repeated string strings = 3;
  repeated string imports = 4; repeated Function callers = 5; repeated Function callees = 6;
  string analysis_json = 7; string model = 8; string prompt_hash = 9;
  string disassembly = 10; string pcode = 11; AnalysisResult result = 12; repeated DecisionRecord decisions = 13;
}
message Job { string id = 1; string function_id = 2; string name = 3; string stage = 4; string status = 5; uint32 attempts = 6; string error = 7; int64 updated_at = 8; reserved 9; int64 started_at = 10; int64 finished_at = 11; }
message JobList { repeated Job jobs = 1; }
message Event { int64 id = 1; int64 created_at = 2; string level = 3; string message = 4; }
message EventList { repeated Event events = 1; }
message ControlRequest { string binary_id = 1; string action = 2; }
message ReviewRequest { reserved 1, 2; string result_id = 3; uint32 expected_revision = 4; string field = 5; string decision = 6; string reason = 7; }
message Settings {
  bool ai_configured = 1; bool ghidra_configured = 2; string model = 3;
  string escalation_model = 4; uint32 concurrency = 5; reserved 6;
  uint32 max_input_bytes = 7; string provider_url = 8; bool batch_enabled = 9;
  string decision_model = 10; string decision_endpoint = 11; double decision_threshold = 12;
}

message AnalysisResult {
 string id = 1; string function_id = 2; string proposed_name = 3; string summary = 4;
 string author = 5; string model = 6; string stage = 7; bool stale = 8;
 uint32 revision = 9; string name_review = 10; string summary_review = 11;
 string analysis_json = 12; string extraction_id = 13; int64 created_at = 14;
 string parent_id = 15; repeated string dependencies = 16; string input_json = 17; string transcript_json = 18; string automation_json = 19;
}
message ResultList { repeated AnalysisResult results = 1; }
message ArtifactRequest { string id = 1; }
message Artifact { string id = 1; string extraction_id = 2; string function_id = 3; string kind = 4; string content = 5; string sha256 = 6; string metadata_json = 7; }
message CorrectionRequest { string result_id = 1; uint32 expected_revision = 2; string proposed_name = 3; string summary = 4; string reason = 5; }
message ReanalysisRequest { string binary_id = 1; repeated string function_ids = 2; bool stale_only = 3; string investigation_id = 4; string stage = 5; }
message RunResponse { string id = 1; uint32 queued = 2; }
message Investigation { string id = 1; string binary_id = 2; string question = 3; string notes = 4; reserved 5; uint32 revision = 6; repeated string function_ids = 7; repeated string result_ids = 8; }
message InvestigationList { repeated Investigation investigations = 1; }
message ApplyRequest { string id = 1; }
message ApplyItem { string result_id = 1; uint32 revision = 2; string address = 3; string expected_name = 4; string expected_comment = 5; string name = 6; string summary = 7; string status = 8; string error = 9; }
message ApplyOperation { string id = 1; string binary_id = 2; string status = 3; string error = 4; repeated ApplyItem items = 5; }

message GraphEdge { string caller = 1; string callee = 2; }
message Graph { repeated Function nodes = 1; repeated GraphEdge edges = 2; uint32 total = 3; }

message ApplyOperationList { repeated ApplyOperation operations = 1; }

message DecisionRecord {
 string id = 1; string stage = 2; string model = 3; string route = 4;
 string request_json = 5; string response_json = 6; string extraction_id = 7;
 string prompt_hash = 8; uint64 input_tokens = 9; uint64 output_tokens = 10;
 optional double cost_usd = 11; int64 created_at = 12;
}

message ProgressReport {
 string phase = 1; string status = 2; uint32 completed = 3; uint32 total = 4;
 int64 elapsed_seconds = 5; int64 eta_seconds = 6; string detail = 7;
 int64 updated_at = 8;
}

message StartRecordingRequest {
 string binary_id = 1; string scenario = 2; string executable = 3;
 uint32 pid = 4; string mode = 5; repeated string function_ids = 6;
 uint32 seconds = 7; repeated string arguments = 8; string working_directory = 9;
 uint32 argument_count = 10; uint32 snapshot_bytes = 11; bool trace_memory = 12;
}
message RecordingControl { string id = 1; string action = 2; string label = 3; }
message Recording {
 string id = 1; string binary_id = 2; string scenario = 3; string mode = 4;
 string status = 5; string error = 6; int64 created_at = 7; int64 finished_at = 8;
 string progress_json = 9; string coverage_json = 10; string analysis_run_id = 11;
 string ghidra_status = 12;
}
message RecordingList { repeated Recording recordings = 1; }
