# Copy to pistondecompiler.toml. Relative paths resolve from the working directory.
data_dir = "data"
listen = "127.0.0.1:7070"
web_dir = "web/dist"
# For Vite development only, allow the exact browser origin:
# browser_origins = ["http://localhost:3000"]
# ghidra_home = "/opt/ghidra_12.1.3_PUBLIC"
ghidra_timeout_secs = 7200
# Open the native GUI after extraction and use it for later writeback.
ghidra_gui = false
# Python environment with Frida. Relative paths resolve beside this config.
runtime_python = ".venv-runtime/bin/python"

[ai]
# Use a chat-completions compatible provider. No model or price is assumed.
base_url = "https://openrouter.ai/api/v1"
api_key_env = "PISTONDECOMPILER_AI_API_KEY"
model = ""
escalation_model = ""
concurrency = 4
max_input_bytes = 24000
max_output_tokens = 1000
# Optional OpenRouter effort. Omit to use the model default.
# reasoning_effort = "low"
# Enable when the provider supports JSON Schema responses.
structured_outputs = false
max_attempts = 3
request_timeout_secs = 120
# Enable only when this provider supports /files and /batches.
batch_enabled = false
batch_size = 500

# Optional: enable Jev preprocessing and proposal assessment through OpenRouter.
# Uses ai.api_key_env. Omit this table to use the original generation-only pipeline.
# [ai.decisions]
# endpoint = "https://openrouter.ai/api/alpha/decisions"
# model = "typesafe/jev-1.13"
# confidence_threshold = 0.95
# max_input_bytes = 96000
